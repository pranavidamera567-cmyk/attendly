services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: attendly
      POSTGRES_USER: attendly
      POSTGRES_PASSWORD: attendly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendly -d attendly -h 127.0.0.1"]
      interval: 3s
      retries: 15

  web:
    build: .
    ports: ["5002:5002"]
    environment:
      DATABASE_URL: postgresql+psycopg2://attendly:attendly@db:5432/attendly
      SECRET_KEY: change-me-in-real-deployments
    depends_on:
      db: { condition: service_healthy }

  pgadmin:                      # database browser: http://localhost:5050  (admin@example.com / admin)
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports: ["5050:80"]
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on: [db]
