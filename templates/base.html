<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Attendly{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet">
</head>
<body data-page="{{ page|default('') }}">
{% if user %}
<nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4 d-print-none">
  <div class="container">
    <a class="navbar-brand" href="/">Attendly</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link {{ 'active' if page == 'dashboard' }}" href="/">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if page == 'attendance' }}" href="/attendance">Attendance</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if page == 'leave' }}" href="/leave">Leave</a></li>
        {% if user.role in ('manager', 'admin') %}<li class="nav-item"><a class="nav-link {{ 'active' if page == 'reports' }}" href="/reports">Reports</a></li>{% endif %}
        {% if user.role == 'admin' %}<li class="nav-item"><a class="nav-link {{ 'active' if page == 'users' }}" href="/admin/users">Users</a></li>{% endif %}
      </ul>
      <span class="navbar-text me-3">{{ user.name }} <span class="badge text-bg-secondary">{{ user.role }}</span></span>
      <button class="btn btn-outline-light btn-sm" id="logout">Log out</button>
    </div>
  </div>
</nav>
{% endif %}
<main class="container pb-5">
  <div id="toast-area" class="mb-3"></div>
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
