{% extends "base.html" %}
{% block title %}Attendance · Attendly{% endblock %}
{% block content %}
<div class="row g-4">
  <div class="col-lg-4">
    <div class="card shadow-sm"><div class="card-body">
      <h2 class="h5">Record attendance</h2>
      <form id="att-form" class="row g-2">
        {% if user.role == 'admin' %}<div class="col-12"><label class="form-label" for="af-user">Employee</label><select id="af-user" class="form-select"></select></div>{% endif %}
        <div class="col-12"><label class="form-label" for="af-date">Date</label><input id="af-date" type="date" class="form-control" required></div>
        <div class="col-6"><label class="form-label" for="af-in">Check in</label><input id="af-in" type="time" class="form-control" required></div>
        <div class="col-6"><label class="form-label" for="af-out">Check out</label><input id="af-out" type="time" class="form-control"></div>
        <div class="col-12"><label class="form-label" for="af-status">Status</label>
          <select id="af-status" class="form-select"><option value="present">Present</option><option value="remote">Remote</option><option value="half_day">Half day</option></select></div>
        <div class="col-12"><label class="form-label" for="af-note">Note</label><input id="af-note" class="form-control" maxlength="200"></div>
        <div class="col-12"><button class="btn btn-primary">Save entry</button></div>
      </form>
    </div></div>
  </div>
  <div class="col-lg-8">
    <div class="card shadow-sm"><div class="card-body">
      <div class="row g-2 mb-3">
        <div class="col-sm-4"><input type="month" id="att-month" class="form-control" aria-label="Month"></div>
        {% if user.role != 'employee' %}<div class="col-sm-5"><input type="search" id="att-q" class="form-control" placeholder="Search employee…" aria-label="Search employee"></div>{% endif %}
      </div>
      <div class="table-responsive"><table class="table table-sm table-hover align-middle" id="att-table">
        <thead><tr><th>Date</th>{% if user.role != 'employee' %}<th>Employee</th>{% endif %}<th>In</th><th>Out</th><th>Hours</th><th>Status</th></tr></thead><tbody></tbody></table></div>
      <div id="att-pager"></div>
    </div></div>
  </div>
</div>
{% endblock %}
